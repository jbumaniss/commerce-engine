framework:
    messenger:
        # CQRS bus separation (CE-019):
        #  - command.bus: synchronous, exactly one handler per command (writes).
        #  - event.bus: domain events, zero or more handlers.
        default_bus: command.bus
        buses:
            command.bus: ~
            event.bus:
                default_middleware:
                    allow_no_handlers: true
        transports:
            # Async processing transport (CE-020): Redis for local/dev. The DSN is env-driven
            # so the transport can be swapped (e.g. an SQS-compatible one) by configuration only.
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
        routing:
            App\Catalog\Domain\Event\ProductWasCreated: async

when@test:
    framework:
        messenger:
            # In-process transport: the suite exercises async routing without a live broker.
            transports:
                async: 'in-memory://'

framework:
    messenger:
        # CQRS bus separation (CE-019):
        #  - command.bus: synchronous, exactly one handler per command (writes).
        #  - event.bus: domain events, zero or more handlers.
        default_bus: command.bus
        # Messages that exhaust their retries are routed to a dead-letter transport (CE-023).
        failure_transport: failed
        buses:
            command.bus: ~
            event.bus:
                default_middleware:
                    allow_no_handlers: true
        transports:
            # Async processing transport (CE-020): Redis for local/dev. The DSN is env-driven
            # so the transport can be swapped (e.g. an SQS-compatible one) by configuration only.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # Retry transient failures with exponential backoff: 1s, 2s, 4s (capped at 10s).
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 10000
            # Dead-letter transport for messages that exhaust their retries (CE-023).
            failed:
                dsn: '%env(MESSENGER_FAILED_TRANSPORT_DSN)%'
        routing:
            App\Catalog\Domain\Event\ProductWasCreated: async

when@test:
    framework:
        messenger:
            # In-process transports: the suite exercises async routing and dead-lettering
            # without a live broker. Only the DSNs are overridden, so the strategy above applies.
            transports:
                async:
                    dsn: 'in-memory://'
                failed:
                    dsn: 'in-memory://'

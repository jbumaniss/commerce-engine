openapi: 3.1.0

info:
  title: Commerce Engine — Product API
  description: >-
    OpenAPI specification for the Commerce Engine product endpoints.
    Errors are returned as RFC 7807 `application/problem+json`. Read endpoints support
    validation-based HTTP caching (ETag / Last-Modified) with conditional requests.
  version: 1.0.0

servers:
  - url: /
    description: Same-origin API root

tags:
  - name: Products
    description: Product catalog resource.

paths:
  /api/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List active products (paginated).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A page of active products.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '304':
          $ref: '#/components/responses/NotModified'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
      responses:
        '201':
          description: The created product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/products/{id}:
    get:
      tags: [Products]
      operationId: getProduct
      summary: Fetch a single product by ID.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: The product.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Replace a product's editable fields.
      description: >-
        Full replacement of the editable fields (name, slug, priceAmount, currency,
        description). The activation state (`isActive`) is left unchanged. Protected by
        optimistic locking: a concurrent modification returns 409.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
      responses:
        '200':
          description: The updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Delete a product.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: The product was deleted. No content.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/products/{id}/activate:
    post:
      tags: [Products]
      operationId: activateProduct
      summary: Activate a product.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The activated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/products/{id}/deactivate:
    post:
      tags: [Products]
      operationId: deactivateProduct
      summary: Deactivate a product.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The deactivated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Product:
      type: object
      description: The API representation of a product.
      required:
        - id
        - name
        - slug
        - priceAmount
        - currency
        - description
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          examples: [42]
        name:
          type: string
          examples: ['PlayStation 5']
        slug:
          type: string
          examples: ['playstation-5']
        priceAmount:
          type: integer
          description: Price in the currency's minor units (e.g. cents).
          examples: [49999]
        currency:
          type: string
          description: ISO 4217 three-letter currency code.
          examples: ['EUR']
        description:
          type: [string, 'null']
          examples: ['Current-generation console.']
        isActive:
          type: boolean
          examples: [true]
        createdAt:
          type: string
          format: date-time
          examples: ['2026-07-24T10:15:30+00:00']
        updatedAt:
          type: string
          format: date-time
          examples: ['2026-07-24T10:15:30+00:00']

    ProductList:
      type: object
      description: A single page of products with pagination metadata.
      required:
        - items
        - page
        - perPage
        - total
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          examples: [1]
        perPage:
          type: integer
          examples: [20]
        total:
          type: integer
          examples: [137]
        totalPages:
          type: integer
          examples: [7]

    ProductWriteRequest:
      type: object
      description: Payload for creating or fully updating a product.
      required:
        - name
        - slug
        - priceAmount
        - currency
      properties:
        name:
          type: string
          maxLength: 255
          examples: ['PlayStation 5']
        slug:
          type: string
          maxLength: 255
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Lowercase letters, numbers, and hyphens only.
          examples: ['playstation-5']
        priceAmount:
          type: integer
          minimum: 0
          description: Price in the currency's minor units (e.g. cents).
          examples: [49999]
        currency:
          type: string
          description: ISO 4217 three-letter currency code.
          examples: ['EUR']
        description:
          type: [string, 'null']
          maxLength: 5000
          examples: ['Current-generation console.']

    ProblemDetails:
      type: object
      description: RFC 7807 problem details, served as `application/problem+json`.
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          examples: ['about:blank']
        title:
          type: string
          examples: ['Not Found']
        status:
          type: integer
          examples: [404]
        detail:
          type: string
          examples: ['Product not found.']
        violations:
          type: array
          description: Field-level validation failures (present on 422 responses).
          items:
            $ref: '#/components/schemas/Violation'

    Violation:
      type: object
      required:
        - property
        - message
      properties:
        property:
          type: string
          examples: ['slug']
        message:
          type: string
          examples: ['The slug must contain lowercase letters, numbers, and hyphens only.']

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: The product's unique identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      required: false
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Conditional request validator; returns 304 when the ETag still matches.
      schema:
        type: string
    IfModifiedSince:
      name: If-Modified-Since
      in: header
      required: false
      description: Conditional request validator; returns 304 when not modified since the given date.
      schema:
        type: string

  headers:
    ETag:
      description: Entity tag for validation-based caching.
      schema:
        type: string
    LastModified:
      description: Last modification timestamp for validation-based caching.
      schema:
        type: string

  responses:
    NotModified:
      description: The cached representation is still fresh; no body is returned.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    NotFound:
      description: The product does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: >-
        The request conflicts with the current state: a duplicate slug, or a concurrent
        modification detected by optimistic locking.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: The request payload or query parameters failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

; Supervisor program for the Symfony Messenger async worker (CE-029).
;
; Deploy on the host running the app image:
;   cp docker/supervisor/messenger-worker.conf /etc/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update
;
; Workers restart on exit (autorestart), are recycled by --time-limit / --memory-limit to
; bound memory growth, and stop gracefully on TERM (stopwaitsecs > a single message's time).
; Monitor queues with `messenger:stats` and the dead-letter queue with `messenger:failed:show`.

[program:commerce-engine-messenger]
command=php /app/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stopsignal=TERM
killasgroup=true
stdout_logfile=/var/log/supervisor/messenger-worker.log
stderr_logfile=/var/log/supervisor/messenger-worker.error.log

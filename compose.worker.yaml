---
# Optional async Messenger worker for local/dev (CE-029). Not loaded by default; run with:
#   docker compose -f compose.yaml -f compose.override.yaml -f compose.worker.yaml up -d worker
# In production, prefer Supervisor to manage the workers (see docker/supervisor/messenger-worker.conf).
services:
  worker:
    image: ${IMAGES_PREFIX:-}app-php-dev
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M", "-v"]
    volumes:
      - ./:/app
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
      MESSENGER_FAILED_TRANSPORT_DSN: redis://redis:6379/failed
      REDIS_URL: redis://redis:6379
      MAILER_DSN: ${MAILER_DSN:-null://null}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
